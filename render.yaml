# Render Blueprint: deploys the FastAPI backend and Streamlit frontend as two web services
services:
  - type: web
    name: legalease-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn legalEaseAPI.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  - type: web
    name: legalease-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BACKEND_URL
        sync: false   # e.g. https://legalease-api.onrender.com
